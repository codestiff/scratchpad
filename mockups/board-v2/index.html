<script>
'use strict';
// Illustrative graph only. Production must use the shared records evaluator.
const projects=[{id:'transect',name:'Transect',description:'A place to walk, stay the night, and return to.',repos:['transect','asset-generators'],objective:'A friend can play on a phone and wants to come back.'},{id:'factory',name:'Asset factory',description:'Reusable assets with checked geometry, materials, motion, collision, and sound.',repos:['asset-generators'],objective:'A consumer can use the asset with evidence of its response.'},{id:'records-board',name:'Records & board',description:'A shared work model, with decisions and delivery visible in one place.',repos:['codestiff-llm-plugins','asset-generators'],objective:'See what to decide, what can start, and what proves delivery.'}];
const milestones=[{id:'first-return',project:'transect',name:'A friend returns the next morning',due:'11 Oct',rank:1,sentence:'A friend opens the link on a phone, walks to the loch, sleeps, and the next morning the table says they came back.',gate:'A real next-day return is observed on the playable build.',measurement:'Not measured in this example',source:'milestones/week-1.md',sourceNote:'Real player sentence; association, counts and statuses are illustrative.',questions:['Does the return measure capture a real player coming back?']},{id:'first-asset',project:'factory',name:'One asset, checked end to end',due:'18 Oct',rank:2,sentence:'A consumer loads one reusable asset and its documented responses hold up under checks.',gate:'Consumer check and ablation evidence are attached.',measurement:'Checks incomplete in this example',source:'No source record — concept only',sourceNote:'This milestone is an illustrative design fixture.',questions:[]},{id:'board-clarity',project:'records-board',name:'Decide and coordinate from the board',due:'18 Oct',rank:1,sentence:'Open a milestone and see what remains, what you block, and which evidence is missing.',gate:'Board and CLI agree at the same input observations.',measurement:'Parity not yet demonstrated',source:'No source record — concept only',sourceNote:'This milestone is an illustrative design fixture.',questions:['What should the first implementation increment include?']}];
const decisions=[{id:'return-measure',milestone:'first-return',title:'Agree the return-visit measure',request:'Confirm what counts as a return visit, or edit the proposed measure.',why:'Instrumentation and the final phone check depend on this definition.',record:'demo/return-measure',type:'Owner agreement',age:'Waiting 1 day'},{id:'feedback-words',milestone:'first-return',title:'Choose the player feedback prompt',request:'Choose the wording shown after the first night.',why:'The prompt and the final phone check need agreed wording.',record:'demo/feedback-words',type:'Open question',age:'Waiting 1 day'},{id:'board-scope',milestone:'board-clarity',title:'Agree the first board increment',request:'Confirm Projects, Milestones, and milestone detail as the first increment.',why:'The snapshot contract and both page types need an agreed scope.',record:'cx-demo/board-scope',type:'Scope agreement',age:'New'}];
const steps=[
{id:'t1',milestone:'first-return',plan:'Playable night',name:'Open the start card on a phone',seat:'ui',done:true,deps:[],owner:[]},
{id:'t2',milestone:'first-return',plan:'Playable night',name:'Walk to the loch',seat:'sim',done:true,deps:[],owner:[]},
{id:'t3',milestone:'first-return',plan:'Playable night',name:'Sleep through the first night',seat:'sim',done:true,deps:[],owner:[]},
{id:'t4',milestone:'first-return',plan:'Return evidence',name:'Instrument the return-visit measure',seat:'edge',done:false,deps:[],owner:['return-measure']},
{id:'t5',milestone:'first-return',plan:'Return evidence',name:'Check the next-day return reading',seat:'qa',done:false,deps:['t4'],owner:[]},
{id:'t6',milestone:'first-return',plan:'Player feedback',name:'Add the feedback prompt',seat:'ui',done:false,deps:[],owner:['feedback-words']},
{id:'t7',milestone:'first-return',plan:'Phone review',name:'Verify the complete return journey on a phone',seat:'qa',done:false,deps:['t5','t6'],owner:[]},
{id:'t8',milestone:'first-return',plan:'Phone review',name:'Write the first-run instructions',seat:'fable',done:false,deps:[],owner:[]},
{id:'a1',milestone:'first-asset',plan:'Checked asset',name:'Define the consumer contract',seat:'core',done:true,deps:[],owner:[]},
{id:'a2',milestone:'first-asset',plan:'Checked asset',name:'Generate the asset fixture',seat:'commission',done:true,deps:[],owner:[]},
{id:'a3',milestone:'first-asset',plan:'Checked asset',name:'Run response checks',seat:'qa',done:false,deps:[],owner:[],external:'Compute job result not available'},
{id:'a4',milestone:'first-asset',plan:'Checked asset',name:'Compare ablation evidence',seat:'qa',done:false,deps:['a3'],owner:[]},
{id:'a5',milestone:'first-asset',plan:'Checked asset',name:'Write consumer usage notes',seat:'core',done:false,deps:[],owner:[]},
{id:'b1',milestone:'board-clarity',plan:'Board pages',name:'Research the records workflow',seat:'principal',done:true,deps:[],owner:[]},
{id:'b2',milestone:'board-clarity',plan:'Board pages',name:'Define the evaluated snapshot contract',seat:'core',done:false,deps:[],owner:['board-scope']},
{id:'b3',milestone:'board-clarity',plan:'Board pages',name:'Expose project and milestone rollups',seat:'edge',done:false,deps:['b2'],owner:[]},
{id:'b4',milestone:'board-clarity',plan:'Board pages',name:'Show remaining work and owner blockers',seat:'edge',done:false,deps:['b3'],owner:[]},
{id:'b5',milestone:'board-clarity',plan:'Evidence consistency',name:'Reconcile step proof with dependency checks',seat:'core',done:false,deps:[],owner:[]},
{id:'b6',milestone:'board-clarity',plan:'Board pages',name:'Check parity and phone navigation',seat:'qa',done:false,deps:['b4','b5'],owner:[]}
];
function milestoneSteps(id){return steps.filter(s=>s.milestone===id);}
function ownerRoots(id,seen=new Set()){if(seen.has(id))return [];seen.add(id);const s=steps.find(s=>s.id===id);if(!s||s.done)return [];return [...new Set([...s.owner,...s.deps.flatMap(d=>ownerRoots(d,new Set(seen)))])];}
function status(s){if(s.done)return 'done';if(s.owner.length)return 'owner';if(s.external||s.deps.some(id=>!steps.find(x=>x.id===id)?.done))return 'held';return 'ready';}
function rollup(id){const all=milestoneSteps(id),remaining=all.filter(s=>!s.done),mine=remaining.filter(s=>ownerRoots(s.id).length);return {total:all.length,done:all.length-remaining.length,remaining:remaining.length,blockedByYou:mine.length,direct:mine.filter(s=>s.owner.length).length,indirect:mine.filter(s=>!s.owner.length).length,ready:remaining.filter(s=>status(s)==='ready').length,decisions:decisions.filter(d=>d.milestone===id).length};}
function impacted(decision){return steps.filter(s=>!s.done&&ownerRoots(s.id).includes(decision));}
function projectRollup(id){return milestones.filter(m=>m.project===id).reduce((a,m)=>{const r=rollup(m.id);for(const k of ['done','total','remaining','blockedByYou','decisions'])a[k]+=r[k];a.milestones++;return a;},{done:0,total:0,remaining:0,blockedByYou:0,decisions:0,milestones:0});}
function filteredSteps(id,filter='remaining',query=''){return milestoneSteps(id).filter(s=>(filter==='all'||!s.done)&&(filter!=='owner'||ownerRoots(s.id).length)&&(filter!=='ready'||status(s)==='ready')&&[s.id,s.name,s.plan,s.seat].join(' ').toLowerCase().includes(query.toLowerCase()));}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
// Illustrative history. A production snapshot must come from git/records at that point in time.
const historyEvents = [
  {date:'2026-10-04',milestone:'first-return',kind:'scope',ids:['t1','t2','t3','t4','t5','t6'],text:'Six steps enter the milestone'},
  {date:'2026-10-06',milestone:'first-return',kind:'landed',ids:['t1'],text:'The start card opens on a phone'},
  {date:'2026-10-07',milestone:'first-return',kind:'landed',ids:['t2'],text:'The player reaches the loch'},
  {date:'2026-10-08',milestone:'first-return',kind:'scope',ids:['t7','t8'],text:'Phone review and first-run instructions added to scope'},
  {date:'2026-10-09',milestone:'first-return',kind:'landed',ids:['t3'],text:'The player can sleep through the first night'},
  {date:'2026-10-04',milestone:'first-asset',kind:'scope',ids:['a1','a2','a3','a4','a5'],text:'Five checked-asset steps enter the milestone'},
  {date:'2026-10-06',milestone:'first-asset',kind:'landed',ids:['a1'],text:'Consumer contract documented'},
  {date:'2026-10-08',milestone:'first-asset',kind:'landed',ids:['a2'],text:'Asset fixture generated'},
  {date:'2026-10-04',milestone:'board-clarity',kind:'scope',ids:['b1','b2','b3','b4','b5','b6'],text:'Six board steps enter the milestone'},
  {date:'2026-10-07',milestone:'board-clarity',kind:'landed',ids:['b1'],text:'Records workflow research completed'}
];
function dateLabel(date){return new Date(date+'T12:00:00Z').toLocaleDateString('en-GB',{day:'numeric',month:'short',timeZone:'UTC'});}
function snapshotAt(id,date){
  const scope=new Set(),landed=new Set();
  for(const e of historyEvents.filter(e=>e.milestone===id&&e.date<=date).sort((a,b)=>a.date.localeCompare(b.date))){
    for(const key of e.ids){if(e.kind==='scope')scope.add(key);if(e.kind==='removed')scope.delete(key);if(e.kind==='landed')landed.add(key);if(e.kind==='reopened')landed.delete(key);}
  }
  const active=steps.filter(s=>scope.has(s.id));
  const groups=[...new Set(active.map(s=>s.plan))];
  const completed=active.filter(s=>landed.has(s.id)).length;
  const completedPlans=groups.filter(p=>active.filter(s=>s.plan===p).every(s=>landed.has(s.id))).length;
  return {date,total:active.length,completed,remaining:active.length-completed,plans:groups.length,completedPlans,percent:active.length?completed/active.length*100:null};
}
function historyFor(id){return Array.from({length:7},(_,i)=>snapshotAt(id,'2026-10-'+String(i+4).padStart(2,'0')));}

if(typeof document!=='undefined'){
const el=id=>document.getElementById(id),page=el('page'),labels={done:'Landed',owner:'Needs you',held:'Held',ready:'Ready'};
const link=(path,label)=>`<a href="#/${path}">${esc(label)}</a>`;
function crumb(parts){return `<div class="breadcrumbs">${parts.join(' &nbsp;/&nbsp; ')}</div>`;}
function progress(r){return `<div class="progress" aria-hidden="true"><span style="width:${r.total?r.done/r.total*100:0}%"></span></div><div class="small">${r.done} of ${r.total} known steps landed · ${r.remaining} remaining</div>`;}
function footer(){return '<footer class="footer">Illustrative statuses, decisions, dependencies, and counts. No live connection or writes. Landed steps are delivery evidence; the outcome gate is a separate check.</footer>';}
function milestoneCard(m){const r=rollup(m.id);return `<a class="panel link" href="#/milestones/${m.id}"><div class="between"><span class="label">${esc(projects.find(p=>p.id===m.project).name)}</span><span class="badge ${r.blockedByYou?'owner':'unknown'}">${r.blockedByYou?'Needs you':'Gate unverified'}</span></div><h3>${esc(m.name)}</h3><p class="small">${esc(m.sentence)}</p><div class="small">Target ${esc(m.due)} · owner order ${m.rank} · sample</div>${progress(r)}<div class="metric-row"><div class="metric"><b>${r.remaining}</b><span>steps remaining</span></div><div class="metric owner"><b>${r.blockedByYou}</b><span>blocked by you</span></div></div></a>`;}
function projectsPage(){page.innerHTML=crumb(['Workspace','Projects'])+`<div class="hero"><span class="label">Portfolio</span><h1>Projects</h1><p class="muted">See the outcomes each project is working toward, and where your decisions matter.</p></div><div class="grid">${projects.map(p=>{const r=projectRollup(p.id);return `<a class="panel link" href="#/projects/${p.id}"><span class="label">${r.milestones} milestone · sample</span><h2 class="project-name">${esc(p.name)}</h2><p class="muted">${esc(p.description)}</p><div class="small">${esc(p.repos.join(' + '))}</div><div class="metric-row"><div class="metric"><b>${r.remaining}</b><span>steps remaining</span></div><div class="metric owner"><b>${r.blockedByYou}</b><span>blocked by you</span></div></div></a>`;}).join('')}</div>`+footer();}
function projectPage(id){const p=projects.find(p=>p.id===id);if(!p)return missing();const r=projectRollup(id);page.innerHTML=crumb([link('projects','Projects'),esc(p.name)])+`<div class="hero"><span class="label">Project</span><h1>${esc(p.name)}</h1><p class="muted">${esc(p.objective)}</p><p class="small">Repositories: ${esc(p.repos.join(' + '))}</p><div class="rollup"><span>${r.remaining} known steps remaining</span><span>${r.decisions} owner decisions</span><span>${r.blockedByYou} steps affected</span></div></div><div class="section-head"><h2>Milestones</h2><p class="muted">Open a milestone to see exactly what is left and what waits on you.</p></div><div class="grid">${milestones.filter(m=>m.project===id).map(milestoneCard).join('')}</div>`+footer();}
function milestonesPage(){page.innerHTML=crumb(['Workspace','Milestones'])+`<div class="hero"><span class="label">Across projects</span><h1>Milestones</h1><p class="muted">Remaining work, owner blockers, and outcome evidence for every milestone.</p></div><div class="grid">${milestones.map(milestoneCard).join('')}</div>`+footer();}
function ownerCard(d){const ss=impacted(d.id);return `<article class="owner-card"><div class="between"><span class="badge owner">${esc(d.type)}</span><span class="small">${esc(d.age)}</span></div><h3>${esc(d.title)}</h3><div class="request"><div class="small">Your response</div><p style="margin:4px 0 0">${esc(d.request)}</p></div><p class="muted">${esc(d.why)}</p><details><summary>${ss.length} remaining steps depend on this decision</summary><ul>${ss.map(s=>`<li>${esc(s.name)}${s.owner.includes(d.id)?' · direct':' · downstream'}</li>`).join('')}</ul></details><div class="unlock">${esc(d.record)} · <button class="text-link" style="border:0;background:none;color:var(--green);padding:0" data-decision="${d.id}">Read proposal</button></div></article>`;}
function workCard(s){const st=status(s),roots=ownerRoots(s.id),ds=roots.map(id=>decisions.find(d=>d.id===id)?.title||id);const why=s.done?'Sample main-branch step proof':s.owner.length?'Waiting for your agreement':ds.length?'Downstream of your decision'+(ds.length>1?'s':''):s.external||(st==='held'?'Waiting for prerequisite work':'No unresolved prerequisite in this example');return `<button class="work" data-step="${s.id}" aria-label="Inspect ${esc(s.name)}"><div class="between"><span class="mono">${esc(s.plan)} / ${esc(s.id)}</span><span class="badge ${st}">${labels[st]}</span></div><h3>${esc(s.name)}</h3><div class="small">Next seat: ${esc(s.seat)} · ${esc(why)}</div>${ds.length?`<p><span style="color:var(--amber)">Blocked by you:</span> ${ds.map(esc).join(' + ')}</p>`:''}</button>`;}
function milestonePage(id,params){const m=milestones.find(m=>m.id===id);if(!m)return missing();const p=projects.find(p=>p.id===m.project),r=rollup(id),filter=params.get('filter')||'remaining';page.innerHTML=crumb([link('projects','Projects'),link('projects/'+p.id,p.name),'Milestone'])+`<div class="hero"><div class="between"><span class="label">Milestone · order ${m.rank}</span><span class="badge unknown">Outcome unverified</span></div><h1>${esc(m.name)}</h1><p class="muted">${esc(m.sentence)}</p><div class="small">Target ${esc(m.due)} · sample schedule</div></div>${milestoneNav(id)}<div class="overview"><div class="big"><div class="number">${r.remaining}</div><b>Steps remaining</b><p>${r.done} of ${r.total} known steps landed</p></div><a class="big owner" href="#/milestones/${id}?filter=owner"><div class="number">${r.blockedByYou}</div><b style="color:var(--ink)">Blocked by you</b><p>${r.decisions} decisions · includes downstream work</p></a></div><div class="summary">${progress(r)}<p class="note">Known scope, not an estimate of time. ${r.ready} step ready independently. Outcome gate still unverified.</p></div><div class="split"><section><div class="section-head"><h2>What is waiting on you</h2><p class="muted" style="font-size:13px">Your decisions and the remaining work they hold up.</p></div><div class="stack">${decisions.filter(d=>d.milestone===id).map(ownerCard).join('')||'<div class="empty">No owner decisions block this milestone in the example.</div>'}</div>${r.blockedByYou?`<p class="note">${r.blockedByYou} unique steps affected: ${r.direct} directly, ${r.indirect} downstream. Shared dependencies count once.</p>`:''}</section><aside class="aside"><div class="panel"><h3>Outcome gate</h3><p>${esc(m.gate)}</p><span class="badge unknown">${esc(m.measurement)}</span><hr><h3>Scope & evidence</h3><p>${r.total} known steps · further work may be discovered.</p><p class="small">Source: ${esc(m.source)}<br>${esc(m.sourceNote)}</p>${m.questions.length?'<hr><h3>Open questions</h3>'+m.questions.map(q=>`<p>${esc(q)}</p>`).join(''):''}</div></aside></div><section class="section"><h2>Remaining work</h2><p class="muted" style="font-size:13px">Every known step, its next seat, and the reason it is held.</p><div class="toolbar">${[['remaining','Remaining · '+r.remaining],['owner','Blocked by me · '+r.blockedByYou],['ready','Ready · '+r.ready],['all','All steps · '+r.total]].map(([v,label])=>`<button class="filter" data-filter="${v}" data-milestone="${id}" aria-pressed="${filter===v}">${label}</button>`).join('')}<label class="sr-only" for="search">Search milestone steps</label><input class="search" id="search" type="search" placeholder="Search steps or seats"></div><div class="stack" id="step-list">${filteredSteps(id,filter).map(workCard).join('')||'<div class="empty">No steps match this view.</div>'}</div></section>`+footer();el('search').addEventListener('input',()=>{el('step-list').innerHTML=filteredSteps(id,filter,el('search').value).map(workCard).join('')||'<div class="empty">No steps match this view.</div>';});}
function needsYouPage(){page.innerHTML=crumb(['Workspace','Needs you'])+`<div class="hero"><span class="label">Across milestones</span><h1>Needs you</h1><p class="muted">Owner decisions stay attached to the milestone they affect.</p></div><div class="stack">${milestones.filter(m=>decisions.some(d=>d.milestone===m.id)).map(m=>`<section><div class="section-head"><h2>${link('milestones/'+m.id,m.name)}</h2><p class="small">${rollup(m.id).blockedByYou} unique remaining steps blocked by you</p></div><div class="stack">${decisions.filter(d=>d.milestone===m.id).map(ownerCard).join('')}</div></section>`).join('')}</div>`+footer();}
function workPage(){page.innerHTML=crumb(['Workspace','Work'])+`<div class="hero"><span class="label">Across projects</span><h1>Remaining work</h1><p class="muted">Open a milestone for its owner decisions and outcome gate.</p></div><div class="stack">${milestones.map(m=>`<section><div class="section-head"><h2>${link('milestones/'+m.id,m.name)}</h2></div><div class="stack">${filteredSteps(m.id).map(workCard).join('')}</div></section>`).join('')}</div>`+footer();}
function missing(){page.innerHTML='<h1>Page not found</h1><p>'+link('projects','Back to Projects')+'</p>';}
function showDetail(id,isDecision=false){const d=isDecision?decisions.find(d=>d.id===id):null,s=!isDecision?steps.find(s=>s.id===id):null;if(!d&&!s)return;const m=milestones.find(m=>m.id===(d||s).milestone),roots=s?ownerRoots(s.id):[d.id];el('detail-body').innerHTML=`<div class="between"><span class="mono">${esc((d||s).id)} · illustrative</span><button class="close" id="close" aria-label="Close details">Close ×</button></div><h2 id="detail-title">${esc(d?d.title:s.name)}</h2><p class="small">${esc(m.name)}</p>${d?`<div class="request"><b>Your response</b><p>${esc(d.request)}</p></div><div class="detail-block"><h3>Work affected</h3>${impacted(d.id).map(s=>`<p>${esc(s.name)} · ${s.owner.includes(d.id)?'direct':'downstream'}</p>`).join('')}</div><p class="note">An answer would be recorded through the existing records workflow. This mockup cannot approve or edit it.</p>`:`<span class="badge ${status(s)}">${labels[status(s)]}</span><div class="detail-block"><h3>Next responsible seat</h3><p>${esc(s.seat)} · ${esc(s.plan)}</p></div><div class="detail-block"><h3>Why it is held</h3><p>${roots.length?roots.map(id=>esc(decisions.find(d=>d.id===id).request)).join('<br>'):s.external?esc(s.external):status(s)==='held'?'Unfinished prerequisite work':s.done?'The sample step has landed':'No unresolved prerequisite in this example'}</p>${s.deps.length?'<div class="chain">Prerequisites: '+s.deps.map(id=>esc(steps.find(s=>s.id===id).name)).join(' · ')+'</div>':''}</div><div class="detail-block"><h3>Evidence</h3><p>${s.done?'Illustrative main-branch proof, not a real commit':'No completion proof in this fixture'}</p></div>`}<div class="detail-block"><h3>Provenance</h3><p class="small">Sample graph only. No live claim, session, owner approval, or commit is asserted.</p>${link('milestones/'+m.id,'Open milestone →')}</div>`;el('close').onclick=()=>el('detail').close();el('detail').showModal();}
let historySelection={milestone:null,mode:'remaining',day:6};
function milestoneNav(id,active='overview'){return `<nav class="resource-nav" aria-label="Milestone pages"><a href="#/milestones/${id}" ${active==='overview'?'aria-current="page"':''}>Overview</a><a href="#/milestones/${id}/progress" ${active==='progress'?'aria-current="page"':''}>Progress & history</a></nav>`;}
function fmtPercent(n){return n===null?'Unknown':Number(n.toFixed(1))+'%';}
function historyChart(id,mode,day){
  const rows=historyFor(id),titles={remaining:'Steps remaining',completed:'Steps completed',percent:'Known scope completed',plans:'Plans completed'};
  const key={remaining:'remaining',completed:'completed',percent:'percent',plans:'completedPlans'}[mode];
  const max=mode==='percent'?100:mode==='plans'?Math.max(...rows.map(r=>r.plans),1):Math.max(...rows.map(r=>r.total),1);
  const x=i=>64+i*88,y=n=>220-(n/max)*182;
  const points=rows.map((r,i)=>`${x(i)},${y(r[key]||0)}`).join(' ');
  const showScope=mode==='completed'||mode==='plans',scopeKey=mode==='plans'?'plans':'total';
  const scopePoints=rows.map((r,i)=>`${x(i)},${y(r[scopeKey])}`).join(' ');
  const ticks=[...new Set(Array.from({length:5},(_,i)=>mode==='percent'?i*25:Math.round(max*i/4)))];
  const selected=rows[day];
  return `<svg class="chart" viewBox="0 0 640 282" role="img" aria-labelledby="chart-title chart-desc"><title id="chart-title">${titles[mode]}, 4–10 October, illustrative history</title><desc id="chart-desc">${rows.map(r=>dateLabel(r.date)+': '+(mode==='percent'?fmtPercent(r.percent):r[key])).join('; ')}. Scope increases from six to eight steps on 8 October in the Transect example.</desc>${ticks.map(n=>`<line x1="64" y1="${y(n)}" x2="592" y2="${y(n)}" stroke="#e4e9df"/><text x="48" y="${y(n)+6}" text-anchor="end">${n}${mode==='percent'?'%':''}</text>`).join('')}<line x1="${x(day)}" x2="${x(day)}" y1="28" y2="224" stroke="#b6c6ab" stroke-dasharray="4 5"/>${showScope?`<polyline points="${scopePoints}" fill="none" stroke="#8d998b" stroke-width="2.5" stroke-dasharray="7 5"/>`:''}<polyline points="${points}" fill="none" stroke="#27664a" stroke-width="3.5"/>${rows.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r[key]||0)}" r="${i===day?6:3.5}" fill="#27664a"/><text x="${x(i)}" y="252" text-anchor="middle">${new Date(r.date+'T12:00:00Z').getUTCDate()}</text>`).join('')}${rows.map((r,i)=>i&&r.total!==rows[i-1].total?`<text class="annotation" x="${x(i)}" y="18" text-anchor="middle">${r.total-rows[i-1].total>0?'+':''}${r.total-rows[i-1].total} scope</text>`:'').join('')}<text x="592" y="277" text-anchor="end">October · sample</text><circle cx="${x(day)}" cy="${y(selected[key]||0)}" r="10" fill="none" stroke="#27664a" stroke-width="1.5"/></svg>`;
}
function progressPage(id){
  const m=milestones.find(m=>m.id===id);if(!m)return missing();const p=projects.find(p=>p.id===m.project);
  if(historySelection.milestone!==id)historySelection={milestone:id,mode:'remaining',day:6};
  page.innerHTML=crumb([link('projects','Projects'),link('projects/'+p.id,p.name),link('milestones/'+id,'Milestone'),'Progress'])+`<div class="hero"><span class="label">Milestone / progress</span><h1>${esc(m.name)}</h1><p class="muted">What landed, what remains, and how the known scope changed each day.</p><span class="badge unknown">Illustrative history · 4–10 Oct</span></div>${milestoneNav(id,'progress')}<div id="history-heading" class="snapshot-heading" aria-live="polite"></div><div id="history-stats" class="progress-stats"></div><section class="chart-panel"><div class="between"><h2 id="history-chart-heading">Steps remaining</h2><span class="small">7 daily snapshots</span></div><div class="chart-modes" id="chart-modes">${[['remaining','Remaining'],['completed','Completed'],['percent','Completion %'],['plans','Plans']].map(([v,label])=>`<button class="filter" data-history-mode="${v}">${label}</button>`).join('')}</div><div id="chart-legend" class="chart-legend"></div><div id="history-chart"></div><label class="small" for="history-day">Choose a day to inspect its totals</label><input class="history-slider" type="range" id="history-day" min="0" max="6" step="1" value="${historySelection.day}"><div class="daily-status" id="daily-change" aria-live="polite"></div></section><p class="history-note">No deadline is needed for this chart. An upward move in remaining work can mean scope was added. Percentages use each day's known scope; outcome acceptance remains a separate check.</p><div class="history-layout"><section class="section"><div class="section-head"><h2>Day by day</h2><p class="small">End-of-day totals. Select a date to inspect it.</p></div><div class="table-wrap"><table class="history-table"><thead><tr><th>Date</th><th>Steps<br>landed / scope</th><th>Plans<br>finished / known</th><th>Complete</th><th>Left</th></tr></thead><tbody>${historyFor(id).map((r,i)=>`<tr data-history-row="${i}"><td><button class="date-button" data-history-day="${i}">${dateLabel(r.date)}</button></td><td>${r.completed} / ${r.total}</td><td>${r.completedPlans} / ${r.plans}</td><td>${fmtPercent(r.percent)}</td><td>${r.remaining}</td></tr>`).join('')}</tbody></table></div><p class="note">A plan is counted here when all of its known scoped steps have landed. This is a delivery rollup, separate from the plan record's lifecycle state.</p></section><section class="section"><div class="section-head"><h2>Delivery timeline</h2><p class="small" id="timeline-asof"></p></div><div class="timeline" id="delivery-timeline"></div></section></div>`+footer();
  el('history-day').addEventListener('input',e=>{historySelection.day=Number(e.target.value);refreshHistory(id);});
  refreshHistory(id);
}
function refreshHistory(id){
  const rows=historyFor(id),day=historySelection.day,r=rows[day],prev=rows[day-1],mode=historySelection.mode;
  el('history-heading').textContent=dateLabel(r.date)+' · end of day · sample totals';
  el('history-stats').innerHTML=`<div class="big"><div class="number">${r.completed}<span class="small"> / ${r.total}</span></div><b>Steps landed</b></div><div class="big"><div class="number">${r.completedPlans}<span class="small"> / ${r.plans}</span></div><b>Plans finished</b></div><div class="big"><div class="number">${fmtPercent(r.percent)}</div><b>Known scope done</b></div>`;
  el('history-chart-heading').textContent={remaining:'Steps remaining',completed:'Steps completed',percent:'Known scope completed',plans:'Plans completed'}[mode];
  document.querySelectorAll('[data-history-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.historyMode===mode)));
  el('chart-legend').innerHTML=`<span>${{remaining:'Remaining steps',completed:'Landed steps',percent:'Completed / known steps',plans:'Finished plans'}[mode]}</span>${mode==='completed'||mode==='plans'?'<span class="scope">Known scope</span>':''}`;
  el('history-chart').innerHTML=historyChart(id,mode,day);el('history-day').value=day;
  const dScope=prev?r.total-prev.total:0,delta=prev?r.completed-prev.completed:0,dPlans=prev?r.completedPlans-prev.completedPlans:0;
  el('daily-change').textContent=prev?`${delta>=0?'+':''}${delta} steps landed · ${dPlans>=0?'+':''}${dPlans} plans finished · ${dScope?((dScope>0?'+':'')+dScope+' scope steps'):'scope unchanged'} since ${dateLabel(prev.date)}.`:'Starting snapshot. Earlier activity is outside this sample.';
  document.querySelectorAll('[data-history-row]').forEach(row=>row.classList.toggle('selected',Number(row.dataset.historyRow)===day));
  el('timeline-asof').textContent='Through '+dateLabel(r.date)+' · sample evidence';
  const events=historyEvents.filter(e=>e.milestone===id&&e.date<=r.date).sort((a,b)=>b.date.localeCompare(a.date));
  el('delivery-timeline').innerHTML=events.map(e=>{const after=snapshotAt(id,e.date),before=snapshotAt(id,new Date(new Date(e.date+'T12:00:00Z').getTime()-86400000).toISOString().slice(0,10));const completedPlans=after.completedPlans-before.completedPlans;return `<article class="event ${e.kind==='scope'?'scope':''}"><span class="small">${dateLabel(e.date)} · ${e.kind==='scope'?'Scope added':'Landed'}</span><h3>${esc(e.text)}</h3><p>${e.kind==='scope'?'+'+e.ids.length+' known steps':e.ids.length+' step landed'+(completedPlans>0?' · '+completedPlans+' plan finished':'')}</p>${e.kind==='landed'?e.ids.map(key=>`<button class="text-link" style="border:0;background:none;padding:0;color:var(--green)" data-step="${key}">${esc(steps.find(s=>s.id===key).name)} →</button>`).join(''):''}<p class="small">Illustrative ${e.kind==='landed'?'commit / Plan-Step proof':'scope change'}, not a live repository event.</p></article>`;}).join('');
}

function render(){const raw=location.hash.replace(/^#\/?/,'')||'projects';const [path,q='']=raw.split('?'),[section,id,subpage]=path.split('/');document.querySelectorAll('[data-nav]').forEach(a=>{if(a.dataset.nav===section)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});if(section==='projects')id?projectPage(id):projectsPage();else if(section==='milestones')id?(subpage==='progress'?progressPage(id):milestonePage(id,new URLSearchParams(q))):milestonesPage();else if(section==='needs-you')needsYouPage();else if(section==='work')workPage();else missing();}
page.addEventListener('click',e=>{const st=e.target.closest('[data-step]'),d=e.target.closest('[data-decision]'),f=e.target.closest('[data-filter]'),hm=e.target.closest('[data-history-mode]'),hd=e.target.closest('[data-history-day]');if(hm){historySelection.mode=hm.dataset.historyMode;refreshHistory(historySelection.milestone);}if(hd){historySelection.day=Number(hd.dataset.historyDay);refreshHistory(historySelection.milestone);}if(st)showDetail(st.dataset.step);if(d)showDetail(d.dataset.decision,true);if(f)location.hash='/milestones/'+f.dataset.milestone+'?filter='+f.dataset.filter;});el('detail').addEventListener('click',e=>{if(e.target.closest('a'))el('detail').close();});window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);});render();
}
</script></body></html>

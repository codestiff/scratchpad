<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shared records snapshot</title><style>
*{box-sizing:border-box}body{margin:0;background:#f6f7f2;color:#213d33;font:15px/1.5 system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:28px 20px}a{color:#27664a}h1{font-size:32px;line-height:1.2;letter-spacing:-1px}h2{font-size:21px}nav{display:flex;gap:18px;margin:24px 0;flex-wrap:wrap}nav a[aria-current]{font-weight:750}article,.card{background:white;border:1px solid #dde5db;border-radius:12px;padding:22px;margin:16px 0}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric{background:white;border:1px solid #dde5db;border-radius:10px;padding:18px}.metric b{display:block;font-size:30px}.muted,small{color:#68776d}.tag{display:inline-block;background:#fff3db;color:#855118;border-radius:6px;padding:4px 9px;font-size:12px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid #dde5db}svg{width:100%;height:auto}code{overflow-wrap:anywhere}.table{overflow:auto}a:focus-visible{outline:3px solid #438bc3}footer{border-top:1px solid #dde5db;padding-top:18px;margin-top:28px;font-size:12px}@media(max-width:650px){.metrics{grid-template-columns:repeat(2,1fr)}main{padding:20px 16px}article{padding:18px}h1{font-size:28px}}
</style></head><body><main><a href="../../">← All mockups</a><h1>One evaluated snapshot</h1><p class="muted">A working data integration preview. Python evaluates the records once; the terminal and this page display those same facts.</p><span class="tag">Illustrative test repository</span><nav><a href="#milestones">Milestones</a><a href="#owner">Needs you</a><a href="#history">Progress & history</a></nav><div id="content" aria-live="polite">Loading snapshot…</div><footer id="provenance"></footer></main><script>
const esc=v=>String(v??'Unknown').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let snapshot;
const percent=v=>v==null?'Unknown':v+'%';
function render(){
 const mode=location.hash.slice(1)||'milestones';document.querySelectorAll('nav a').forEach(a=>{if(a.hash==='#'+mode)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current')});
 const m=snapshot.milestones[0],r=snapshot.records;let html='';
 if(mode==='owner') html='<h2>Owner actions</h2>'+m.owner_blockers.map(b=>`<article><h2>${esc(r.find(x=>x.cite===b.cite)?.title||b.cite)}</h2>${b.reasons.map(v=>`<p>${esc(v)}</p>`).join('')}<p class="muted">Affected records, with shared dependencies listed once:</p><ul>${b.affected_records.map(c=>`<li>${esc(r.find(x=>x.cite===c)?.title||c)} <small>${esc(c)}</small></li>`).join('')}</ul></article>`).join('');
 else if(mode==='history'){
  const points=snapshot.history.points.map(p=>({date:p.date,...p.milestones.find(v=>v.cite===m.cite)}));
  // Coordinates only: all factual values and percentages come from Python.
  const max=Math.max(1,...points.map(p=>p.step_totals.remaining));const x=i=>40+i*620/Math.max(1,points.length-1),y=v=>185-v*140/max;
  html=`<h2>Steps remaining</h2><p class="muted">${esc(snapshot.history.reason)} Percentages use the scope recorded on each day.</p><article><svg viewBox="0 0 700 230" role="img" aria-label="Remaining steps by day"><path d="M40 35V185H660" fill="none" stroke="#dde5db"/><polyline points="${points.map((p,i)=>x(i)+','+y(p.step_totals.remaining)).join(' ')}" fill="none" stroke="#27664a" stroke-width="3"/>${points.map((p,i)=>`<circle cx="${x(i)}" cy="${y(p.step_totals.remaining)}" r="5" fill="#27664a"/><text x="${x(i)}" y="${y(p.step_totals.remaining)-12}" text-anchor="middle" fill="#213d33">${p.step_totals.remaining}</text><text x="${x(i)}" y="215" text-anchor="middle" font-size="12" fill="#68776d">${esc(p.date.slice(5))}</text>`).join('')}</svg></article><div class="table"><table><thead><tr><th>Date</th><th>Steps complete / scope</th><th>Remaining</th><th>Completion</th><th>Plans complete / scope</th></tr></thead><tbody>${points.map(p=>`<tr><td>${esc(p.date)}</td><td>${p.step_totals.completed} / ${p.step_totals.known}</td><td>${p.step_totals.remaining}</td><td>${percent(p.completion_percent)}</td><td>${p.plan_totals.completed} / ${p.plan_totals.total}</td></tr>`).join('')}</tbody></table></div><p class="muted">Added scope raises remaining work and lowers completion from 40% to 25% in this fixture.</p>`;
 }else html=`<h2>${esc(m.title)}</h2><div class="metrics"><div class="metric"><b>${m.step_totals.remaining}</b>Steps remaining</div><div class="metric"><b>${m.step_totals.completed} / ${m.step_totals.known}</b>Steps delivered</div><div class="metric"><b>${percent(m.completion_percent)}</b>Known scope complete</div><div class="metric"><b>${m.plan_totals.completed} / ${m.plan_totals.total}</b>Plans delivered</div></div><article><h2>Plans & evidence</h2>${snapshot.plans.filter(p=>p.milestone===m.cite).map(p=>`<p><b>${esc(p.title)}</b> · ${p.totals.completed} / ${p.totals.known} steps delivered · ${p.totals.remaining} remaining<br><small>${esc(p.cite)} · record state: ${esc(p.state)}</small></p>`).join('')}<p class="muted">Archived plans stay in the denominator. Delivery requires main-branch commit evidence; outcome acceptance remains separate.</p></article><p><a href="#owner">See what needs you →</a> · <a href="#history">View daily progress →</a></p>`;
 document.getElementById('content').innerHTML=html;
}
fetch('snapshot.json').then(r=>{if(!r.ok)throw Error('Snapshot unavailable');return r.json()}).then(d=>{if(d.schema_version!==1)throw Error('Unsupported snapshot schema');snapshot=d;document.getElementById('provenance').innerHTML=`${esc(d.example_notice)}<br>Snapshot schema ${d.schema_version} · input revision <code>${esc(d.provenance.revision)}</code><br>${esc(d.provenance.evaluated_at)} · completion ${esc(d.provenance.completion_quality)} · history ${esc(d.history.quality)}<br><a href="snapshot.json">Inspect the same JSON agents can render</a>`;render()}).catch(e=>{document.getElementById('content').textContent=e.message});window.addEventListener('hashchange',()=>snapshot&&render());
</script></body></html>
